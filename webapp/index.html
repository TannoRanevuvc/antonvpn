<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0f" />
    <meta name="description" content="Данные подписки, клиенты и инструкция по подключению AntonVPN." />
    <title>AntonVPN — ваша подписка</title>
    <script>
      // Apply saved theme before first paint to avoid flash
      try {
        var saved = localStorage.getItem('antonvpn-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
          document.querySelector('meta[name="theme-color"]').setAttribute(
            'content', saved === 'dark' ? '#0b0c0f' : '#f5f5f0'
          );
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f5f0');
        }
      } catch(e) {}
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
